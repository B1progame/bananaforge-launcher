  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="92" y="130" fill="#9fdcc8" font-size="17" font-weight="700" letter-spacing="4">A BETTER WAY TO PLAY YOUR WAY</text>
    <text x="88" y="244" fill="#f6f4ec" font-size="76" font-weight="750" letter-spacing="-3">Your mods.</text>
    <text x="88" y="330" fill="#f6f4ec" font-size="76" font-weight="750" letter-spacing="-3">Your instance.</text>
