    <path d="m-68 5 68-25 68 25-68 27Z" fill="#71806a" stroke="#bdc49b" stroke-width="3"/>
    <path d="M-68 5v16L0 51V32ZM68 5v16L0 51V32Z" fill="#394c42" stroke="#71806a" stroke-width="2"/>
