<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">BananaForge — your mods, your instance</title>
  <desc id="desc">A winding golden map path, bright balloons, and a small tower on a deep forest-green game board.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111b2a"/>
      <stop offset=".55" stop-color="#1b3140"/>
      <stop offset="1" stop-color="#213d3c"/>
    </linearGradient>
    <radialGradient id="sun" cx=".73" cy=".35" r=".55">
      <stop stop-color="#ecb552" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ecb552" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2=".5">
      <stop stop-color="#b87934"/>
      <stop offset=".5" stop-color="#f1bd59"/>
      <stop offset="1" stop-color="#ffe19a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffd477"/>
      <stop offset="1" stop-color="#d99135"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071018" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1600" height="600" rx="28" fill="url(#sky)"/>
  <rect width="1600" height="600" rx="28" fill="url(#sun)"/>
  <circle cx="1260" cy="250" r="210" fill="#e9b451" opacity=".09" filter="url(#blur)"/>
  <path d="M0 492c208-79 325-42 494 12s318 75 492 16 371-113 614-54v134H0Z" fill="#132b2a" opacity=".7"/>
  <path d="M0 544c222-44 363-27 526 13s349 39 529-9 345-62 545-21v73H0Z" fill="#182e2d" opacity=".8"/>

  <g opacity=".28" fill="none" stroke="#e8bc66">
    <circle cx="1214" cy="285" r="185" stroke-width="2"/>
    <circle cx="1214" cy="285" r="145" stroke-width="1.5" stroke-dasharray="3 10"/>
    <path d="M968 480 1214 105l254 375" stroke-width="2"/>
  </g>

  <path d="M820 518c125-10 153-89 260-91s121-96 209-94 102-109 214-135" fill="none" stroke="#101a1d" stroke-width="82" stroke-linecap="round"/>
  <path d="M820 510c125-10 153-89 260-91s121-96 209-94 102-109 214-135" fill="none" stroke="#39433a" stroke-width="62" stroke-linecap="round"/>
  <path d="M820 510c125-10 153-89 260-91s121-96 209-94 102-109 214-135" fill="none" stroke="url(#road)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14" opacity=".9"/>
  <g fill="#f7d78c" stroke="#876338" stroke-width="4">
    <circle cx="1081" cy="419" r="8"/><circle cx="1289" cy="324" r="8"/><circle cx="1503" cy="190" r="8"/>
  </g>

  <g filter="url(#shadow)" stroke="#fff3d4" stroke-width="2">
    <g transform="translate(971 457)">
      <ellipse cy="-5" rx="20" ry="26" fill="#f06c72"/><path d="m-6 19 6 10 6-10" fill="#d54d5c" stroke="none"/>
      <ellipse cx="-7" cy="-14" rx="4" ry="7" fill="#fff5dc" stroke="none" opacity=".85"/>
    </g>
